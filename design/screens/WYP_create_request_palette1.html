<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palette 1 — Would You Please — Create Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   Would You Please — Design Tokens (palette 1)
   Single source of truth for colors, effects, and base spacing.

   Draft v0.1 · July 2026
   Consolidated from the six palette-1 mockups; values are the union of their
   :root blocks (all six agreed on every value). Names are reconciled to the
   UI Design Specification §3.1. This file is the one place a token is defined;
   every screen imports it rather than re-declaring its own :root block.

   USAGE
     <link rel="stylesheet" href="tokens.css">   (before the screen's own CSS)
   or, once the build exists:
     @import "tokens.css";

   NAMING
     Token comments give the UI-spec §3.1 name in Title Case, then the token.
     The CSS custom-property name is the durable handle used in code.

   CHANGE CONTROL
     Adding, removing, or re-valuing a token here is a change to §3.1 and must
     be recorded in the decisions log (mirrors the UI-spec §3.3 rule that any
     new token requires updating §3.1 in a new version).
   ============================================================================ */

:root {

  /* --- Brand & action -------------------------------------------------------
     Brand Blue is the only saturated color used at scale besides Alert Red
     (§3.3). It carries buttons, links, the wordmark, selected-chip outlines,
     and read-only detail-field labels (§9.3). */
  --brand-blue:    #2A5FC8;   /* Brand Blue (§3.1) */
  --blue-pressed:  #1E4AA0;   /* pressed state of the primary button (§6.1) */

  /* --- Status ---------------------------------------------------------------
     Alert Red is status-only from v2.5: Overdue, inline error, or impending
     irreversible loss — and nothing else (§3.1). Never decorative. */
  --alert-red:     #D32F2F;   /* Alert Red (§3.1) */

  /* --- Ink (text) ----------------------------------------------------------- */
  --ink:           #1F2933;   /* Ink (§3.1) — primary text, group labels */
  --ink-soft:      #5A6675;   /* Ink Soft (§3.1) — secondary text, captions,
                                 resting field labels, and label-affordance
                                 glyphs (calendar/clock, §6.16) */

  /* --- Surfaces & tints -----------------------------------------------------
     The only tinted backgrounds permitted are Band, Row Tint, and Strip
     (§3.3). Focus Tint is a state fill, not a surface. */
  --row-tint:      #F6F7F9;   /* Row Tint (§3.1) — zebra striping; subtle
                                 pressed states */
  --band:          #E7E7E7;   /* Band (§3.1) — group-label heading bands and
                                 the search-bar surface */
  --strip:         #E5ECF7;   /* Strip (§3.1) — chip-strip background and
                                 full-width form chip rows (§6.2) */

  /* --- Field & focus --------------------------------------------------------
     Focus Tint was named --field in four mockups through v2.9; reconciled to
     --focus-tint here to match §3.1 (all six files now agree). */
  --focus-tint:    #EDF2FD;   /* Focus Tint (§3.1) — focused-field fill (§6.10)
                                 and the banner attention wash (§6.14) */
  --focus-halo:    0 0 0 3px rgba(42,95,200,.22);
                              /* Focus Halo (§3.1) — outer glow on focused
                                 inputs (§6.10) */
  --input-border:  #7E8A9A;   /* Input Border (§3.1) — resting text-input border.
                                 ~3.5:1 on white, meets the 3:1 non-text minimum
                                 (§3.2) */

  /* --- Lines & overlay ------------------------------------------------------ */
  --rule:          #E2E6EC;   /* Rule (§3.1) — hairline borders and separators */
  --scrim:         rgba(31,41,51,.45);
                              /* Scrim (§3.1) — Ink at 45% behind modal dialogs
                                 (§6.12).
                                 NOTE: two mockups (.scrim) hardcode this value
                                 inline instead of using the token. Point them
                                 at var(--scrim) when they are next touched. */

  /* --- Accent (single yellow) ----------------------------------------------- */
  --sort:          #FFE34D;   /* Sort Highlight (§3.1) — the sole yellow in the
                                 system from v2.5. Currently used only on the
                                 active sort pill (§6.3). */

  /* --- Base spacing ---------------------------------------------------------
     Screen gutter. The full spacing scale lives in UI-spec §7.2; only the
     shared page padding is tokenized today. */
  --pad:           14px;      /* screen side padding (§7.3) */


  /* --- Deprecated / unused --------------------------------------------------
     Defined in the mockups but not referenced through var() anywhere. Kept
     here so existing files that declare them do not break, and so the decision
     to retire them is explicit rather than silent. Remove once confirmed unused
     in the build.

     --btn-top  #3A70DC   never referenced; likely a leftover from an earlier
                          gradient-topped button treatment.
     --icon-grey #6B7280  never referenced; §5 information-only icons actually
                          render in --ink-soft (#5A6675). §5.1's "icon-grey"
                          maps to Ink Soft in practice — verify before deleting. */
  --btn-top:       #3A70DC;
  --icon-grey:     #6B7280;

  --locked:#EDEFF2;--locked-ink:#8A93A0;--locked-border:#DDE1E7; /* §6.17 PROPOSED */
}

/* Locked control (§6.22, PROPOSED) — inert, not "lower emphasis".
   Pair with adjacent text saying why; aria-disabled, never disabled. */
.btn.is-locked,.chip.is-locked,.is-locked{background:var(--locked);color:var(--locked-ink);
  border:1px solid var(--locked-border);cursor:not-allowed;
  display:inline-flex;align-items:center;gap:6px;box-shadow:none;font-weight:700;}
.btn.is-locked:hover,.btn.is-locked:active,.chip.is-locked:hover,.chip.is-locked:active,.is-locked:hover,.is-locked:active{background:var(--locked);color:var(--locked-ink);
  border-color:var(--locked-border);}
.is-locked .lockglyph{flex:0 0 auto;width:1em;height:1em;}
</style>
<style>
/* ============================================================================
   Would You Please — Components (palette 1)
   Shared component styles, extracted from the six palette-1 mockups.
   Reads its colors and effects from tokens.css — link tokens.css FIRST.

   Draft v0.1 · July 2026

   ORDER OF STYLESHEETS on every screen:
     1. Google Fonts (Inter)      — loads the type family
     2. tokens.css                — defines every --token
     3. components.css            — this file; the shared parts
     4. <style> in the screen     — only that screen's specific rules

   Selectors here map to UI Design Specification §6 components. A screen that
   needs a variant (e.g. a taller textarea, an acknowledge-only modal) overrides
   the specific property in its own <style>, which wins by source order.
   ============================================================================ */

/* --- Shell & frame -------------------------------------------------------- */
html,body{margin:0;height:100%;background:#fff;}
.frame-none{max-width:480px;margin:0 auto;height:100vh;height:100dvh;
  box-shadow:0 0 0 1px var(--rule);}
@media(min-width:520px){
  html,body{background:#eef1f5;}
  .frame-none{box-shadow:0 6px 30px rgba(20,30,50,.14);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
.app{display:flex;flex-direction:column;height:100%;background:#fff;color:var(--ink);
  font-family:Inter,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;}
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;}

/* --- Header band (§6.8) --------------------------------------------------- */
.hdr{display:flex;align-items:center;gap:11px;padding:13px var(--pad) 12px;}
.logo{flex:0 0 auto;display:flex;}
.logo svg{height:40px;width:auto;display:block;}
.brand{display:flex;flex-direction:column;line-height:1.05;}
.word{font-size:23px;font-weight:800;color:var(--brand-blue);letter-spacing:-.01em;}
.tag{font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-top:1px;}

/* --- Group-label heading band (§6.7) -------------------------------------- */
.band{display:flex;align-items:center;gap:10px;background:var(--band);padding:8px var(--pad);
  margin:11px 0 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);}
.hdr + .band{margin-top:0;border-top:none;}
.glabel{font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
.bandcluster{margin-left:auto;display:flex;align-items:center;gap:8px;}

/* --- Primary button (§6.1) ----------------------------------------------- */
.btn{flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:700;line-height:1.1;color:#fff;
  text-align:center;cursor:pointer;background:var(--brand-blue);
  border:none;border-radius:11px;padding:9px 14px;white-space:nowrap;}
.btn:active{background:var(--blue-pressed);}
.btn:focus-visible{outline:2px solid var(--brand-blue);outline-offset:2px;}

/* --- Secondary button (§6.11) -------------------------------------------- */
.btn-secondary{flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:700;line-height:1.1;
  color:var(--brand-blue);text-align:center;cursor:pointer;background:var(--strip);
  border:1.5px solid var(--brand-blue);border-radius:11px;padding:8px 14px;white-space:nowrap;}
.btn-secondary:active{background:var(--row-tint);}
.btn-secondary:focus-visible{outline:2px solid var(--brand-blue);outline-offset:2px;}

/* --- Text input & floating label (§6.10) ---------------------------------
   Resting label floats inside the field; on focus or when filled it rises and
   shrinks. The label row is a flex line so a §6.16 affordance glyph can sit
   before the label text on screens that use one (harmless where none is set). */
.form{padding:14px var(--pad) 6px;background:var(--row-tint);flex:1 1 auto;}
.fgroup{margin-bottom:12px;}
.flabel{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.ffloat{position:relative;}
.ffloat .flabel{position:absolute;left:11px;top:15px;margin:0;font-size:14px;font-weight:500;
  color:var(--ink-soft);pointer-events:none;transform-origin:left top;
  transition:transform .14s ease,color .14s ease;background:transparent;
  display:flex;align-items:center;gap:6px;white-space:nowrap;}
.ffloat .finput:focus + .flabel,
.ffloat .finput:not(:placeholder-shown) + .flabel,
.ffloat .ftextarea:focus + .flabel,
.ffloat .ftextarea:not(:placeholder-shown) + .flabel{
  transform:translateY(-9px) scale(.79);font-weight:600;color:var(--ink);}
.ffloat .finput:focus + .flabel,
.ffloat .ftextarea:focus + .flabel{color:var(--brand-blue);}
@media (prefers-reduced-motion:reduce){.ffloat .flabel{transition:none;}}
.finput,.ftextarea{font:inherit;font-size:14px;color:var(--ink);background:#fff;
  border:1px solid var(--input-border);border-radius:9px;width:100%;min-height:50px;
  padding:20px 10px 6px;}
.finput:focus,.ftextarea:focus{background:var(--focus-tint);outline:none;
  border-color:var(--brand-blue);box-shadow:var(--focus-halo);}
.ftextarea{resize:vertical;min-height:84px;line-height:1.4;}

/* --- Subscription / Account banner (§6.14) + reserved ad slot (§6.15) ----- */
.subbanner{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:40px;
  background:#fff;border-top:1px solid var(--rule);cursor:pointer;
  font-size:13px;font-weight:700;color:var(--brand-blue);}
.subbanner:active{background:var(--row-tint);}
.adslot{flex:0 0 auto;height:50px;border-top:1px solid var(--rule);background:#fff;
  display:flex;align-items:center;justify-content:center;}
.adbox{width:320px;height:50px;display:flex;align-items:center;justify-content:center;
  border:1px dashed var(--rule);border-radius:4px;color:var(--ink-soft);font-size:11px;letter-spacing:.04em;}

/* --- Modal dialog frame (§6.12) ------------------------------------------
   Shared frame for both variants. The acknowledge-only variant adds cursor
   and per-paragraph spacing in its screen; the action variant adds .modalacts
   with buttons. Scrim now reads the --scrim token (previously hardcoded). */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:10;}
.modal{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);z-index:11;
  background:#fff;border-radius:11px;padding:16px 18px;width:min(88%,380px);
  box-shadow:0 8px 28px rgba(20,30,50,.28);}
.modalacts{display:flex;justify-content:flex-end;gap:8px;}
/* Modal header variant — title + actions on the same top row (Add Dialog,
   2026-08-07), a different §6.12 variant from Add Category's title-then-
   bottom-.modalacts layout. See globals.css for the fuller comment. */
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.modalhead .modal-title{margin:0;}
.modalhead .modalacts{flex:0 0 auto;}
/* Chip row on a Strip backdrop, no gating note (Add Dialog's Kind picker,
   2026-08-07) — a plain-language duplicate of .sendrow's properties under a
   neutral name; see globals.css for the fuller comment. */
.chiprow{display:flex;align-items:center;gap:6px;background:var(--strip);border-radius:9px;
  padding:6px 10px;width:100%;min-height:44px;flex-wrap:wrap;}

/* --- Icon button (band cluster addition, 2026-08-05) ----------------------
   40-px touch target / 22-px glyph, same sizing as Main Screen's .iconbtn.
   Inline SVG rather than Main Screen's base64 PNG: this file has no embedded
   raster assets, and a stroked line icon matches the calendar/clock/lookup
   glyphs already used on this screen. */
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;
  border-radius:10px;cursor:pointer;color:var(--ink-soft);background:none;border:none;padding:0;}
.iconbtn:hover{background:rgba(42,95,200,.08);color:var(--brand-blue);}
.iconbtn:active{background:rgba(42,95,200,.16);}
.iconbtn:focus-visible{outline:2px solid var(--brand-blue);outline-offset:2px;}
.iconbtn svg{width:22px;height:22px;display:block;}

</style>
<style>
/* Field rows */
.frow{display:flex;gap:8px;align-items:center;}
.frow .ffloat{flex:1 1 auto;min-width:0;}
.frow .btn{align-self:center;}
.ftextarea{min-height:96px;}

/* Stacked action row (§6.26, PROPOSED, 2026-08-07) — Add Dialog / Add
   Attachment sit alone on their own row, right-aligned, above a full-width
   box, replacing the earlier .frow.top/.attachrow side-by-side layout.
   Dialog and Attachments hold a full paragraph or a file list, not a single
   line, so giving the button a fixed width beside them starved the box on
   narrow Android widths — costs one line of vertical space, returns most of
   the row's horizontal space to the box that needs it. Recipient/Category
   keep .frow: a one-line input doesn't have this problem. */
.fieldact{display:flex;justify-content:flex-end;margin-bottom:6px;}
/* padding-top reverted to the base .ftextarea value (2026-08-07): the label
   went back to one line (below) now that the box is full-width, so the extra
   36px clearance for a two-line label is no longer needed — kept it would
   have left a dead gap above the text. */
.ftextarea.ftextarea-dialog{min-height:130px;}

/* Required-field border (2026-08-07) — a white required field wasn't
   visually distinct enough from an optional field that's been filled in
   (also white, per .opt below). Uses --ink, not literal black: no pure-black
   token exists, and #1F2933 reads as black at 1px. */
.finput.req,.ftextarea.req{border-color:var(--ink);}
.finput.req:focus,.ftextarea.req:focus{border-color:var(--brand-blue);}

/* Small parenthetical label text (2026-08-07) — "(optional)" was crowding
   Category/Due Time on narrow Android widths. (Dialog used a two-line
   .twoline variant briefly; removed 2026-08-07 once the box went full-width
   and "Dialog (Questions, Answers, Comments)" fit on one line at the normal
   label size — see decisions log.) */
.subnote{font-size:11px;font-weight:500;color:var(--ink-soft);}

/* Optional-field shading (2026-08-07 PREVIEW) — owner's "squint test" idea:
   tint optional fields so required ones (plain white) are what visually
   stands out, rather than marking required fields with an asterisk or a
   legend at the top of the screen. Reuses --row-tint (already the .form's
   own page background) rather than a new color — this file's owner-drawn
   original used a pale green not tied to any existing token; light blue was
   also considered and rejected, since --focus-tint and --strip already use
   that hue for focus state and chip-strip surfaces, and a third blue-ish
   surface would blur those meanings. Row Tint's own connotation
   (de-emphasis: zebra striping, subtle pressed states) already matches
   "optional" reasonably well, and reusing it keeps this from needing a
   fourth tinted-background token, which §3.3 doesn't otherwise allow
   (Band, Row Tint, Strip are the only three). Still focuses to
   --focus-tint like every other field — this only changes the RESTING fill.
   Applied here to Due Time, Category, and Dialog — the three actually-
   optional fields on this screen. Not yet applied anywhere outside this
   mockup; pending a decision on whether to adopt it app-wide. */
.finput.opt,.ftextarea.opt{background:var(--row-tint);}
.finput.opt:focus,.ftextarea.opt:focus{background:var(--focus-tint);}

/* Lookup / picker glyph (§6.16) — part of the resting label; hidden when floated,
   except picker fields keep it while a value is present so the picker re-opens */
.lglyph{flex:0 0 auto;width:17px;height:17px;display:inline-block;}
.lglyph svg{width:17px;height:17px;display:block;}
.ffloat .finput:focus + .flabel .lglyph,
.ffloat .finput:not(:placeholder-shown) + .flabel .lglyph{display:none;}
.ffloat.picker .finput:focus + .flabel .lglyph,
.ffloat.picker .finput:not(:placeholder-shown) + .flabel .lglyph{display:inline-block;}

/* Delivery-channel caption (§9.2.2) — shown after a contact is selected */
/* Fixed 2026-08-06: was margin:-8px 0 12px 2px, which overlapped the
   Recipient row's bottom edge once actually rendered live (this mockup keeps
   .chancap hidden, so it was never visually verified here). */
.chancap{display:none;font-size:12px;color:var(--ink-soft);margin:4px 0 12px 2px;}

/* Attachments panel (§9.2.2) — full-width under .fieldact's Add Attachment
   row (2026-08-07); no longer paired with the button via .attachrow. */
/* min-height, not height (2026-08-07): a fixed height clipped .locknote on
   narrow widths / larger Android font-scale settings. */
/* Row Tint, not white (2026-08-07): always empty in this v1 locked state,
   so it always gets the "optional and empty" treatment. */
.attachpanel{flex:1 1 auto;min-width:0;position:relative;background:var(--row-tint);
  border:1px solid var(--input-border);border-radius:9px;min-height:118px;padding:24px 4px 6px 4px;}
.attachpanel .plabel{position:absolute;left:11px;top:6px;font-size:11px;font-weight:600;color:var(--ink);pointer-events:none;}
.attachlist{height:100%;overflow-y:auto;scrollbar-gutter:stable;}
.attitem{display:flex;align-items:center;gap:8px;padding:5px 7px;font-size:13px;color:var(--ink);}
.attitem + .attitem{border-top:1px solid var(--rule);}
.attname{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.attremove{flex:0 0 auto;font:inherit;font-size:15px;font-weight:700;line-height:1;
  color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:2px 5px;border-radius:6px;}
.attremove:active{background:var(--row-tint);color:var(--alert-red);}
.attremove:focus-visible{outline:2px solid var(--brand-blue);outline-offset:1px;}

/* Paid-feature locked state (v1: attachments deferred to the paid tier).
   Keeps the attachments panel frame; replaces the functional list with a lock
   glyph + gating copy pointing to the subscription banner (§6.14), mirroring the
   Request-Texting gating pattern. Candidate for a shared WYP-LockedFeature
   component once a second surface uses it. */
.locked{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;height:100%;text-align:center;padding:4px 12px;}
.locked .lock{width:20px;height:20px;color:var(--ink-soft);flex:0 0 auto;}
.locked .lockttl{font-size:12.5px;font-weight:700;color:var(--ink);}
.locked .locknote{font-size:12px;line-height:1.35;color:var(--ink-soft);}
/* superseded 2026-08-03: the solid --ink-soft fill read as an active button.
   Locked now uses the shared .is-locked treatment (§6.22). */
</style></head>
<body>
<div class="frame-none"><div class="app">

  <div class="hdr">
    <span class="logo" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="16 8 212 200"><g><path d="M 52,22 H 156 A 24 24 0 0 1 180,46 V 138 A 24 24 0 0 1 156,162 H 86 L 44,198 L 52,162 A 24 24 0 0 1 28,138 V 46 A 24 24 0 0 1 52,22 Z" fill="#FFFFFF" stroke="#2A5FC8" stroke-width="11" stroke-linejoin="round"/><rect x="52" y="46" width="104" height="11" rx="5.5" fill="#A7BCE8"/><rect x="52" y="70" width="104" height="11" rx="5.5" fill="#A7BCE8"/><rect x="52" y="94" width="76" height="11" rx="5.5" fill="#A7BCE8"/><rect x="52" y="118" width="58" height="11" rx="5.5" fill="#A7BCE8"/><polyline points="104,122 140,158 210,52" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><polyline points="104,122 140,158 210,52" fill="none" stroke="#1A3A75" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
    </span>
    <span class="brand">
      <span class="word">Would You Please</span>
      <span class="tag">Tracking Requests and ToDos</span>
    </span>
    <!-- Print moved out of the band cluster 2026-08-07 — narrow Android
         widths crowded it against Send/Cancel and the "Create a Request"
         title wrapped. Header has room; matches where Log Out used to sit
         on Main Screen (moved further, see that screen's own 2026-08-07 fix). -->
    <button class="iconbtn" type="button" aria-label="Print Request" style="margin-left:auto;">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M7 8V3h10v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="4" y="8" width="16" height="9" rx="2" stroke="currentColor" stroke-width="2"/>
        <path d="M7 14h10v7H7v-7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="17" cy="11" r="1" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <div class="band">
    <span class="glabel">Create Request</span>
    <span class="bandcluster">
      <button class="btn" type="button">Send</button>
      <button class="btn-secondary" type="button">Cancel</button>
    </span>
  </div>

  <div class="scroll">
    <div class="form">

      <!-- Recipient row (§9.2.2): single Name lookup field (§6.16) + Add
           Contact. Merged from First/Last Name 2026-08-07 — matches Add
           Contact and reads contacts.display_name (migration 005).
           Lookup glyph (wyp_icon_lookup.svg — faded-grey magnifier in Input Border #7E8A9A, overlaid by a solid Ink down-pointer with a white knockout that breaks the lens stroke) sits inside the resting label at ~120% of the label font size and
           disappears when the label floats. -->
      <div class="fgroup frow">
        <span class="ffloat">
          <input class="finput req" id="rn" type="text" autocomplete="off" placeholder=" ">
          <label class="flabel" for="rn"><span class="lglyph"><svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="16" cy="21" r="12" fill="none" stroke="#7E8A9A" stroke-width="3.5"/><line x1="24.5" y1="29.5" x2="36" y2="41" stroke="#7E8A9A" stroke-width="3.5" stroke-linecap="round"/><polygon points="17.5,14 42.5,14 28.5,25" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/><polygon points="17.5,14 42.5,14 28.5,25" fill="#1F2933"/></svg></span>Recipient</label>
        </span>
        <button class="btn" type="button">Add Contact</button>
      </div>
      <!-- Delivery-channel caption, shown only after a contact is selected -->
      <div class="chancap">Will be sent by Email</div>

      <!-- Due row: Due Date (calendar glyph) and Due Time (clock glyph), §6.16 pickers -->
      <div class="fgroup frow">
        <span class="ffloat picker">
          <input class="finput req" id="dd" type="text" inputmode="numeric" placeholder=" ">
          <label class="flabel" for="dd"><span class="lglyph"><svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="7" y="10" width="34" height="32" rx="4" fill="none" stroke="#5A6675" stroke-width="3.5"/><line x1="7" y1="19" x2="41" y2="19" stroke="#5A6675" stroke-width="3.5"/><line x1="16" y1="5" x2="16" y2="12" stroke="#5A6675" stroke-width="3.5" stroke-linecap="round"/><line x1="32" y1="5" x2="32" y2="12" stroke="#5A6675" stroke-width="3.5" stroke-linecap="round"/><circle cx="16" cy="27" r="2.2" fill="#5A6675"/><circle cx="24" cy="27" r="2.2" fill="#5A6675"/><circle cx="32" cy="27" r="2.2" fill="#5A6675"/><circle cx="16" cy="35" r="2.2" fill="#5A6675"/><circle cx="24" cy="35" r="2.2" fill="#5A6675"/></svg></span>Due Date</label>
        </span>
        <span class="ffloat picker">
          <input class="finput opt" id="dt" type="text" inputmode="numeric" placeholder=" ">
          <label class="flabel" for="dt"><span class="lglyph"><svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="24" cy="24" r="17" fill="none" stroke="#5A6675" stroke-width="3.5"/><line x1="24" y1="24" x2="24" y2="13" stroke="#5A6675" stroke-width="3.5" stroke-linecap="round"/><line x1="24" y1="24" x2="32" y2="28" stroke="#5A6675" stroke-width="3.5" stroke-linecap="round"/></svg></span>Due Time <span class="subnote">(optional)</span></label>
        </span>
      </div>

      <!-- Category row: lookup field pre-filled to show the risen-label state
           (glyph hidden when floated, §6.16) + Add Category -->
      <div class="fgroup frow">
        <span class="ffloat">
          <input class="finput opt" id="cat" type="text" autocomplete="off" placeholder=" ">
          <label class="flabel" for="cat"><span class="lglyph"><svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="16" cy="21" r="12" fill="none" stroke="#7E8A9A" stroke-width="3.5"/><line x1="24.5" y1="29.5" x2="36" y2="41" stroke="#7E8A9A" stroke-width="3.5" stroke-linecap="round"/><polygon points="17.5,14 42.5,14 28.5,25" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/><polygon points="17.5,14 42.5,14 28.5,25" fill="#1F2933"/></svg></span>Private Category <span class="subnote">(optional)</span></label>
        </span>
        <button class="btn" type="button">Add Category</button>
      </div>

      <!-- Request Description (§6.10): 500-char limit; counter appears past 400 -->
      <div class="fgroup ffloat">
        <textarea class="ftextarea req" id="desc" maxlength="500" placeholder=" "></textarea>
        <label class="flabel" for="desc">Request Description</label>
      </div>

      <!-- Dialog — Add Dialog opens a modal (2026-08-07), replacing the old
           always-visible inline textarea; matches the live
           CreateRequestForm.tsx and the Add Category modal's existing
           pattern. Entries are held as client-side draft state and written
           to the `dialog` table (migration 004) together with the Request
           when Send is pressed. Answer stays .chip.is-locked here — a
           Request always starts with an empty thread, so there is nothing
           yet to answer (see Respond to Request for the dynamic version). -->
      <div class="fgroup">
        <div class="fieldact"><button class="btn" type="button" onclick="openDialogModal()">Add Dialog</button></div>
        <div class="dlgstaged" id="dlg-staged" style="display:none;"></div>
      </div>

      <!-- Attachments panel — v1 locked "paid feature" state (attachments deferred
           to the paid tier). The functional list + Add control return with the paid
           tier; here the panel advertises the upcoming capability and points to the
           subscription banner (§6.14). Stacked action row (§6.26, 2026-08-07):
           Add Attachment above, full-width panel below — was .attachrow. -->
      <div class="fgroup">
        <div class="fieldact">
          <button class="btn is-locked" type="button" aria-disabled="true"><svg class="lockglyph" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2" stroke="currentColor" stroke-width="2.2"/><path d="M8 10.5V7.5a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Add Attachment</button>
        </div>
        <div class="attachpanel">
          <span class="plabel">Attachments</span>
          <div class="locked">
            <svg class="lock" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2"/></svg>
            <span class="lockttl">A subscription feature</span>
            <span class="locknote">Attach files to your Requests with a subscription &#8212; see the banner below.</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="subbanner" role="button" tabindex="0">See Subscription Features and Other Options</div>
  <div class="adslot" aria-hidden="true"><span class="adbox">AD &#8212; 320&#215;50 RESERVED</span></div>

  <!-- Add Dialog modal (2026-08-07) — title + Cancel/Save on the same top
       row (.modalhead), a different §6.12 variant than Add Category's
       title-then-bottom-buttons layout, matching the owner's mockup for
       this modal specifically. Answer is always .chip.is-locked here — a
       Request always starts with an empty thread. -->
  <div class="scrim" id="dlg-scrim" style="display:none;" onclick="closeDialogModal()"></div>
  <div class="modal" id="dlg-modal" role="dialog" aria-modal="true" aria-labelledby="adddlg-title" style="display:none;">
    <div class="modalhead">
      <p class="modal-title" id="adddlg-title">Add Dialog</p>
      <div class="modalacts">
        <button class="btn-secondary" type="button" onclick="closeDialogModal()">Cancel</button>
        <button class="btn" type="button" onclick="saveDialogEntry()">Save</button>
      </div>
    </div>
    <div class="fgroup">
      <span class="flabel" id="dlgkind-label">Kind</span>
      <div class="chiprow" role="radiogroup" aria-labelledby="dlgkind-label">
        <button class="chip selected" type="button" id="chip-question" aria-pressed="true" onclick="selectKind('question')">Question</button>
        <button class="chip is-locked" type="button" aria-disabled="true" aria-pressed="false">
          <svg class="lockglyph" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2" stroke="currentColor" stroke-width="2.2"/><path d="M8 10.5V7.5a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Answer</button>
        <button class="chip" type="button" id="chip-comment" aria-pressed="false" onclick="selectKind('comment')">Comment</button>
      </div>
    </div>
    <div class="fgroup ffloat">
      <textarea class="ftextarea" id="dlgtext" maxlength="1000" placeholder=" " oninput="document.getElementById('dlg-error').style.display='none'"></textarea>
      <label class="flabel" for="dlgtext">Dialog Text</label>
    </div>
    <p class="ferror" id="dlg-error" style="display:none;margin-top:-8px;">Enter Dialog Text.</p>
  </div>

</div></div>
<script>
/* Add Dialog modal demo (2026-08-07) — mockup-only vanilla JS; the live
   equivalent is CreateRequestForm.tsx's dialogModalOpen/dialogModalKind
   state. Answer stays locked here since a Request always starts with an
   empty thread — no picker logic to demonstrate on this screen. */
var dlgKind = 'question';
function openDialogModal(){
  dlgKind = 'question';
  selectKind('question');
  document.getElementById('dlgtext').value = '';
  document.getElementById('dlg-error').style.display = 'none';
  document.getElementById('dlg-scrim').style.display = 'block';
  document.getElementById('dlg-modal').style.display = 'block';
}
function closeDialogModal(){
  document.getElementById('dlg-scrim').style.display = 'none';
  document.getElementById('dlg-modal').style.display = 'none';
}
function selectKind(kind){
  dlgKind = kind;
  document.getElementById('chip-question').classList.toggle('selected', kind === 'question');
  document.getElementById('chip-comment').classList.toggle('selected', kind === 'comment');
}
function saveDialogEntry(){
  var text = document.getElementById('dlgtext').value.trim();
  if (text === '') { document.getElementById('dlg-error').style.display = 'block'; return; }
  var list = document.getElementById('dlg-staged');
  var row = document.createElement('div');
  row.className = 'attitem';
  var label = dlgKind === 'question' ? 'Question' : 'Comment';
  row.innerHTML = '<span class="attname"><b>' + label + ':</b> ' + text.replace(/</g,'&lt;') + '</span>' +
    '<button class="attremove" type="button" aria-label="Remove this Dialog entry" onclick="this.parentElement.remove()">&times;</button>';
  list.appendChild(row);
  list.style.display = 'block';
  closeDialogModal();
}
</script>
</body></html>
