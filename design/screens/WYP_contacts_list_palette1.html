<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palette 1 — Would You Please — Contacts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   Contacts (2026-08-09, retitled from "My Contacts" same day) — new screen,
   reached from the Main Screen's Housekeeping "Contacts" row. Owner's spec,
   verbatim: "should show the name, notify method and related value (email
   or phone) - and upon click open up a Contact Details screen for editing
   (and should have a Close button)." Row language reuses
   .hkrow/.hktitle/.hknote — same "navigational row: bold Brand-Blue title,
   em-dash, regular Ink description" pattern already established for
   Housekeeping's own rows (§6.23), rather than inventing a new list style
   for what is structurally the same kind of row.

   Retitled "My Contacts" -> "Contacts" the same day the Close button was
   added: owner's call was that the title+Close combination would wrap on
   Android, and — separately — that a navigation destination's title should
   repeat exactly what its Housekeeping row was named when selected. Both
   point the same direction, so the Housekeeping row is "Contacts" too
   (MainScreen.tsx / this file's sibling mockup), not "My Contacts".
   ============================================================================ */

:root{
  --brand-blue:#2A5FC8;--blue-pressed:#1E4AA0;
  --ink:#1F2933;--ink-soft:#5A6675;--row-tint:#F6F7F9;--rule:#E2E6EC;--pad:14px;
  --band:#E7E7E7;--strip:#E5ECF7;--focus-tint:#EDF2FD;
}
html,body{margin:0;height:100%;background:#fff;}
.frame-none{max-width:480px;margin:0 auto;height:100vh;height:100dvh;box-shadow:0 0 0 1px var(--rule);}
@media(min-width:520px){html,body{background:#eef1f5;}.frame-none{box-shadow:0 6px 30px rgba(20,30,50,.14);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
.app{display:flex;flex-direction:column;height:100%;background:#fff;color:var(--ink);
  font-family:Inter,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;}
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;}

.hdr{display:flex;align-items:center;gap:11px;padding:13px var(--pad) 12px;}
.logo{flex:0 0 auto;display:flex;}
.logo svg{height:40px;width:auto;display:block;}
.brand{display:flex;flex-direction:column;line-height:1.05;}
.word{font-size:23px;font-weight:800;color:var(--brand-blue);letter-spacing:-.01em;}
.tag{font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-top:1px;}

.band{display:flex;align-items:center;gap:10px;background:var(--band);padding:8px var(--pad);
  margin:11px 0 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);}
.hdr + .band{margin-top:0;border-top:none;}
.glabel{font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
.bandcluster{margin-left:auto;display:flex;align-items:center;gap:8px;}

.btn{flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:700;line-height:1.1;color:#fff;
  text-align:center;cursor:pointer;background:var(--brand-blue);
  border:none;border-radius:11px;padding:9px 14px;white-space:nowrap;}
.btn:active{background:var(--blue-pressed);}
.btn:focus-visible{outline:2px solid var(--brand-blue);outline-offset:2px;}

.btn-secondary{flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:700;line-height:1.1;
  color:var(--brand-blue);text-align:center;cursor:pointer;background:var(--strip);
  border:1.5px solid var(--brand-blue);border-radius:11px;padding:8px 14px;white-space:nowrap;}
.btn-secondary:active{background:var(--row-tint);}
.btn-secondary:focus-visible{outline:2px solid var(--brand-blue);outline-offset:2px;}

/* Navigational row (§6.23) — same visual language as Housekeeping's rows. */
.hkrows{margin-top:3px;}
.hkrow{padding:9px 12px;border-bottom:1px solid var(--rule);cursor:pointer;}
.hkrow:last-child{border-bottom:none;}
.hkrow:nth-child(even){background:var(--row-tint);}
.hkrow:hover{background:var(--focus-tint);}
.hktext{font-size:12.5px;line-height:1.35;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.hktitle{font-weight:700;color:var(--brand-blue);}
.hknote{font-weight:400;color:var(--ink);}

.subempty{padding:18px 12px;text-align:center;font-size:12.5px;color:var(--ink-soft);line-height:1.4;}
</style></head>
<body>
<div class="frame-none"><div class="app">

  <div class="hdr">
    <span class="logo" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="16 8 212 200"><g><path d="M 52,22 H 156 A 24 24 0 0 1 180,46 V 138 A 24 24 0 0 1 156,162 H 86 L 44,198 L 52,162 A 24 24 0 0 1 28,138 V 46 A 24 24 0 0 1 52,22 Z" fill="#FFFFFF" stroke="#2A5FC8" stroke-width="11" stroke-linejoin="round"/><rect x="52" y="46" width="104" height="11" rx="5.5" fill="#A7BCE8"/><rect x="52" y="70" width="104" height="11" rx="5.5" fill="#A7BCE8"/><rect x="52" y="94" width="76" height="11" rx="5.5" fill="#A7BCE8"/><rect x="52" y="118" width="58" height="11" rx="5.5" fill="#A7BCE8"/><polyline points="104,122 140,158 210,52" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><polyline points="104,122 140,158 210,52" fill="none" stroke="#1A3A75" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
    </span>
    <span class="brand">
      <span class="word">Would You Please</span>
      <span class="tag">Tracking Requests and ToDos</span>
    </span>
  </div>

  <div class="band">
    <span class="glabel">Contacts</span>
    <span class="bandcluster">
      <button class="btn" type="button">Add&nbsp;Contact</button>
      <button class="btn-secondary" type="button">Close</button>
    </span>
  </div>

  <div class="scroll">
    <div class="hkrows">
      <div class="hkrow" role="button" tabindex="0">
        <span class="hktext"><span class="hktitle">Beatrice Barrington</span><span class="hknote"> — Email: beatrice.barrington.demo@example.com</span></span>
      </div>
      <div class="hkrow" role="button" tabindex="0">
        <span class="hktext"><span class="hktitle">Jack Smith</span><span class="hknote"> — Email: jack.smith.demo@example.com</span></span>
      </div>
      <div class="hkrow" role="button" tabindex="0">
        <span class="hktext"><span class="hktitle">Jill Smith</span><span class="hknote"> — Email: jill.smith.demo@example.com</span></span>
      </div>
      <div class="hkrow" role="button" tabindex="0">
        <span class="hktext"><span class="hktitle">Rita Anderson</span><span class="hknote"> — Email: rita.anderson.demo@example.com</span></span>
      </div>
    </div>
    <!-- Empty state, shown instead of .hkrows when there are no contacts yet. -->
    <!-- <div class="subempty">No Contacts yet — use Add Contact.</div> -->
  </div>

</div></div>
</body></html>
